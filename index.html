<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Pokédex Binder</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: binder (leather cover + 4x4 sleeve page) on the left, lookup desk on the right; stacks on phones. Single dark "binder at night" world. */
:root{
  --leather:#1b1f2a; --leather-2:#232838; --stitch:#3a4157;
  --page:#2a3042; --sleeve:rgba(255,255,255,.045); --sleeve-edge:rgba(255,255,255,.12);
  --ink:#eef1f7; --ink-2:#a9b1c6; --ink-3:#6f7891;
  --accent:#ffcb3a; --accent-ink:#1b1f2a; --red:#ff5b5b; --ok:#47d18c;
  --f-display:"Chakra Petch", ui-monospace, "SF Mono", Menlo, monospace;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;max-width:100%}
body{background:#12151d;color:var(--ink);font:15px/1.5 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 40px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.brand h1{font:700 28px/1 var(--f-display);margin:0;letter-spacing:.02em}
.brand h1 span{color:var(--accent)}
.brand p{margin:6px 0 0;color:var(--ink-2);font-size:13px}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{background:var(--leather);border:1px solid var(--stitch);border-radius:10px;padding:8px 14px;min-width:150px}
.stat b{display:block;font:700 22px/1.15 var(--f-display);font-variant-numeric:tabular-nums}
.stat small{color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.bar{height:5px;background:#0d1016;border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}

.tabs{display:flex;gap:6px}
.tab{background:transparent;border:1px solid var(--stitch);border-radius:999px;padding:6px 14px;color:var(--ink-2)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}

.main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:minmax(0,1fr)}}

/* binder */
.binder{background:linear-gradient(160deg,var(--leather-2),var(--leather));border-radius:18px;padding:14px;
  border:1px solid #2f3548;box-shadow:0 20px 50px rgba(0,0,0,.45), inset 0 0 0 6px var(--leather), inset 0 0 0 7px var(--stitch)}
.bnav{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:6px 6px 12px}
.bnav .pg{font:600 15px var(--f-display);font-variant-numeric:tabular-nums;margin-right:auto}
.bnav .pg em{font-style:normal;color:var(--ink-3);font-size:12px;margin-left:6px}
.btn{background:var(--page);border:1px solid var(--sleeve-edge);border-radius:8px;padding:6px 12px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.danger{color:var(--red)}
select.btn{padding-right:8px}
.gens{display:flex;flex-wrap:wrap;gap:4px;padding:0 6px 12px}
.gens button{background:transparent;border:1px solid var(--stitch);color:var(--ink-2);border-radius:6px;padding:2px 8px;font:600 12px var(--f-display)}
.gens button.on{border-color:var(--accent);color:var(--accent)}

.page{background:var(--page);border-radius:10px;padding:12px;position:relative;
  background-image:radial-gradient(circle at 0 50%,#12151d 0 7px,transparent 8px);background-size:18px 25%;background-repeat:repeat-y;padding-left:26px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pocket{position:relative;aspect-ratio:63/88;border-radius:7px;background:var(--sleeve);border:1px solid var(--sleeve-edge);
  overflow:hidden;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.pocket::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:7px;
  background:linear-gradient(115deg,rgba(255,255,255,.10) 0%,rgba(255,255,255,0) 28%,rgba(255,255,255,0) 70%,rgba(255,255,255,.05) 100%)}
.pocket:hover{border-color:var(--accent)}
.pocket .no{position:absolute;top:5px;left:7px;font:600 11px var(--f-display);color:var(--ink-3);font-variant-numeric:tabular-nums}
.pocket .spr{width:70%;max-width:100%;filter:grayscale(1) brightness(.55);opacity:.55}
.pocket .nm{font-size:11px;color:var(--ink-3);padding:0 4px;line-height:1.2;margin-top:2px;overflow-wrap:anywhere}
.pocket.manual{border-color:var(--ok)}
.pocket.manual .spr{filter:none;opacity:1}
.pocket.manual .nm{color:var(--ink)}
.pocket .cardimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pocket .tag{position:absolute;right:4px;bottom:4px;background:rgba(10,12,18,.85);border:1px solid var(--accent);color:var(--accent);
  font:700 10px var(--f-display);border-radius:4px;padding:1px 4px;font-variant-numeric:tabular-nums;z-index:1}
.pocket .tick{position:absolute;top:4px;right:5px;color:var(--ok);font-weight:700;font-size:12px}
.pocket.flash{animation:flash 1.2s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--accent)}30%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
@media (max-width:480px){.grid{gap:6px}.page{padding:8px 8px 8px 20px}.pocket .nm{font-size:9.5px}}

/* list view */
.listbar{display:flex;flex-wrap:wrap;gap:8px;padding:6px 6px 12px}
.listbar input{flex:1 1 180px;min-width:0}
.field{background:#0f1219;border:1px solid var(--stitch);border-radius:8px;padding:8px 10px}
.dexlist{background:var(--page);border-radius:10px;max-height:70vh;overflow:auto}
.row{display:grid;grid-template-columns:28px 48px 40px minmax(0,1fr) auto;gap:10px;align-items:center;padding:4px 12px;border-bottom:1px solid rgba(255,255,255,.05)}
.row img{width:40px;height:40px;image-rendering:pixelated}
.row .n{font:600 13px var(--f-display);color:var(--ink-3);font-variant-numeric:tabular-nums}
.row .who{min-width:0}
.row .who small{color:var(--ink-3);margin-left:6px}
.row .st{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.row.have .st{color:var(--ok)}
.row input{width:18px;height:18px;accent-color:var(--ok)}
.row button.go{background:none;border:0;padding:0;text-align:left;color:var(--ink)}

/* lookup desk */
.desk{background:var(--leather);border:1px solid var(--stitch);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;position:sticky;top:12px}
@media (max-width:900px){.desk{position:static}}
.desk h2{font:700 17px var(--f-display);margin:0}
.desk .hint{font-size:12.5px;color:var(--ink-2);margin:0}
.search{display:flex;gap:6px}
.search input{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{background:#0f1219;border:1px dashed var(--stitch);border-radius:6px;padding:2px 8px;font:500 12px var(--f-display);color:var(--ink-2)}
.status{font-size:13px;color:var(--ink-2);min-height:1em}
.status.err{color:var(--red)}
.results{display:flex;flex-direction:column;gap:10px;max-height:65vh;overflow:auto}
.res{display:grid;grid-template-columns:96px minmax(0,1fr);gap:10px;background:var(--page);border-radius:10px;padding:8px}
.res img{width:96px;border-radius:5px;display:block}
.res h3{margin:0;font-size:14.5px}
.res .meta{font-size:12px;color:var(--ink-3)}
.prices{display:flex;flex-direction:column;gap:2px;margin:6px 0;font-size:12.5px;font-variant-numeric:tabular-nums}
.prices div{display:flex;justify-content:space-between;gap:8px}
.prices b{color:var(--accent)}
.links{display:flex;flex-wrap:wrap;gap:4px;font-size:12px}
.links a{border:1px solid var(--stitch);border-radius:5px;padding:1px 6px;text-decoration:none}
.res .act{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap}
.res .act .btn{padding:4px 10px;font-size:13px}
.flag{display:inline-block;font:700 10px/1 var(--f-display);padding:3px 5px;border-radius:4px;vertical-align:2px;background:#0f1219;border:1px solid var(--stitch);color:var(--ink-2)}
.flag.jp{border-color:var(--red);color:var(--red)}
.grp{font:600 12px var(--f-display);color:var(--ink-3);text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
details.set{font-size:13px;color:var(--ink-2)}
details.set summary{cursor:pointer}
details.set .rowf{display:flex;flex-direction:column;gap:4px;margin-top:8px}
details.set .rowf>div{display:flex;gap:6px;flex-wrap:wrap}

/* dialog */
dialog{background:var(--leather-2);color:var(--ink);border:1px solid var(--stitch);border-radius:14px;padding:16px;width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.6)}
.dlg{display:grid;grid-template-columns:180px minmax(0,1fr);gap:14px}
@media (max-width:520px){.dlg{grid-template-columns:minmax(0,1fr)}}
.dlg img.big{width:100%;border-radius:8px}
.dlg h3{margin:0;font:700 20px var(--f-display)}
.dlg .ko{color:var(--ink-2);font-size:14px}
.dlg .act{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);
  font-weight:700;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:5;max-width:calc(100vw - 32px)}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>POKÉDEX <span>BINDER</span></h1>
      <p>1025 ô · binder 4×4 · 16 thẻ mỗi trang · lưu trên máy này</p>
    </div>
    <div class="stats">
      <div class="stat"><small>Đã có</small><b id="sOwned">0 / 1025</b><div class="bar"><i id="sBar"></i></div></div>
      <div class="stat"><small>Tổng giá collection</small><b id="sValue">$0.00</b><small id="sValueNote"></small></div>
    </div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tabBinder" aria-selected="true">Binder</button>
    <button class="tab" role="tab" id="tabList" aria-selected="false">Check Pokédex (1025)</button>
  </div>

  <div class="main">
    <section>
      <div class="binder" id="viewBinder">
        <div class="bnav">
          <span class="pg" id="pgLabel">Trang 1 / 65</span>
          <button class="btn" id="prev" aria-label="Trang trước">◀</button>
          <select class="btn" id="pgSelect" aria-label="Chọn trang"></select>
          <button class="btn" id="next" aria-label="Trang sau">▶</button>
        </div>
        <div class="gens" id="gens"></div>
        <div class="page"><div class="grid" id="grid"></div></div>
      </div>

      <div class="binder" id="viewList" hidden>
        <div class="listbar">
          <input class="field" id="listQ" placeholder="Tìm tên / số (vd: pikachu, 25, 피카츄)">
          <select class="field" id="listF">
            <option value="all">Tất cả</option>
            <option value="have">Đã có</option>
            <option value="miss">Còn thiếu</option>
          </select>
        </div>
        <div class="dexlist" id="dexlist"></div>
      </div>
    </section>

    <aside class="desk">
      <h2>Tra giá thẻ</h2>
      <p class="hint">Nhập mã thẻ → hiện giá + hình, tìm cả thẻ Nhật lẫn thẻ Anh. Bấm <b>Cho vào binder</b> là thẻ vào đúng ô theo số Pokédex.</p>
      <form class="search" id="sForm">
        <input class="field" id="sInput" placeholder="vd: 068/064, SV7a 068, sv3pt5-25, bruxish" autocomplete="off">
        <button class="btn primary" type="submit">Tìm</button>
      </form>
      <div class="chips" id="chips">
        <button type="button">sv3pt5-25</button>
        <button type="button">base1-4</button>
        <button type="button">MEW 6</button>
        <button type="button">068/064</button>
        <button type="button">SV7a 068</button>
        <button type="button">umbreon</button>
      </div>
      <div class="status" id="status"></div>
      <div class="results" id="results"></div>
      <details class="set">
        <summary>Cài đặt & sao lưu</summary>
        <div class="rowf">
          <label for="apiKey">API key pokemontcg.io (không bắt buộc, giúp tra nhanh hơn)</label>
          <input class="field" id="apiKey" placeholder="dán key vào đây">
          <label for="krw">Tỷ giá KRW / USD (tự nhập, để 0 nếu không cần)</label>
          <input class="field" id="krw" type="number" min="0" step="1">
          <div>
            <button class="btn" type="button" id="refresh">Cập nhật giá cả collection</button>
            <button class="btn" type="button" id="exportB">Xuất file sao lưu</button>
            <label class="btn" for="importF">Nhập file</label>
            <input type="file" id="importF" accept=".json" hidden>
          </div>
        </div>
      </details>
    </aside>
  </div>
</div>

<dialog id="dlg"><div id="dlgBody"></div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>

const money = v => v == null ? "—" : "$" + v.toFixed(2);
const krw = v => (v == null || !S.krw) ? "" : " · ₩" + Math.round(v * S.krw).toLocaleString("ko-KR");

const VARIANT_TD = { normal:"Thường", holofoil:"Holo", "reverse-holofoil":"Reverse holo", reverse:"Reverse holo", "1st-edition":"1st Ed", "1st-edition-holofoil":"1st Ed holo", unlimited:"Unlimited", "unlimited-holofoil":"Unlimited holo" };
const TD_ORDER = ["holofoil","normal","reverse-holofoil","reverse","1st-edition-holofoil","1st-edition","unlimited-holofoil","unlimited"];

/* English card from pokemontcg.io -> common shape */
function normEN(card) {
  const bp = bestPrice(card), rows = [];
  for (const [k, v] of Object.entries(card.tcgplayer?.prices || {})) {
    const val = v.market ?? v.mid ?? v.low;
    if (val != null) rows.push(["TCGplayer · " + (VARIANT_VI[k] || k), money(val), true]);
  }
  const cm = card.cardmarket?.prices, eur = cm ? (cm.trendPrice ?? cm.averageSellPrice ?? null) : null;
  if (eur != null) rows.push(["Cardmarket trend", "€" + eur.toFixed(2), false]);
  return {
    src: "en", key: "en:" + card.id, id: card.id, name: card.name, sub: "",
    set: card.set?.name, setId: card.set?.id, number: card.number, total: card.set?.printedTotal, rarity: card.rarity || "",
    img: card.images?.small, imgL: card.images?.large, dex: card.nationalPokedexNumbers || [],
    usd: bp.usd, variant: bp.variant, variantLabel: bp.variant ? (VARIANT_VI[bp.variant] || bp.variant) : "", eur, rows,
    tcgUrl: card.tcgplayer?.url || "", cmUrl: card.cardmarket?.url || "",
    priceAt: card.tcgplayer?.updatedAt || card.cardmarket?.updatedAt || ""
  };
}

/* Japanese card from TCGdex -> common shape */
function jaToDex(name) {
  if (!name) return null;
  const base = name.replace(/\s*(ex|EX|GX|V|VMAX|VSTAR|BREAK|LV\.X|ＧＸ|Ｖ|ＶＭＡＸ|ＶＳＴＡＲ)$/u, "").trim();
  for (const nm of [name, base]) { const i = NAMES_JA.indexOf(nm); if (i >= 0) return i + 1; }
  const i = NAMES_JA.findIndex(j => base.endsWith(j) || base.startsWith(j));
  return i >= 0 ? i + 1 : null;
}
function normJP(card) {
  const tp = card.pricing?.tcgplayer || {}, cm = card.pricing?.cardmarket || {};
  const rows = []; let usd = null, variant = "";
  const keys = Object.keys(tp).filter(k => tp[k] && typeof tp[k] === "object")
    .sort((a, b) => ((TD_ORDER.indexOf(a) + 99) % 99) - ((TD_ORDER.indexOf(b) + 99) % 99));
  for (const k of keys) {
    const v = tp[k], val = v.marketPrice ?? v.midPrice ?? v.lowPrice;
    if (val == null) continue;
    rows.push(["TCGplayer · " + (VARIANT_TD[k] || k), money(val), true]);
    if (usd == null) { usd = val; variant = VARIANT_TD[k] || k; }
  }
  const eur = cm["trend-holo"] ?? cm.trend ?? cm["avg-holo"] ?? cm.avg ?? null;
  if (eur != null) rows.push(["Cardmarket trend", "€" + eur.toFixed(2), false]);
  let dex = (card.dexId || []).filter(n => n >= 1 && n <= TOTAL);
  if (!dex.length) { const d = jaToDex(card.name); if (d) dex = [d]; }
  const en = dex.length ? NAMES_EN[dex[0] - 1] : card.name;
  const img = card.image ? card.image + "/low.webp" : "", imgL = card.image ? card.image + "/high.webp" : "";
  return {
    src: "jp", key: "jp:" + card.id, id: card.id, name: en + " (JP)", sub: card.name,
    set: card.set?.name, setId: card.set?.id, number: card.localId, total: card.set?.cardCount?.official, rarity: card.rarity || "",
    img, imgL, dex, usd, variant: "", variantLabel: variant, eur, rows,
    tcgUrl: "https://www.tcgplayer.com/search/pokemon-japan/product?productLineName=pokemon-japan&q=" + encodeURIComponent(en + " " + (card.localId || "")),
    cmUrl: "", priceAt: tp.updated || cm.updated || ""
  };
}

/* ---------- search ---------- */
async function api(params) {
  const sp = new URLSearchParams();
  for (const [k, v] of Object.entries(Object.assign({ pageSize: "24", orderBy: "-set.releaseDate",
    select: "id,name,number,rarity,set,images,tcgplayer,cardmarket,nationalPokedexNumbers,supertype" }, params))) if (v) sp.set(k, v);
  const url = API + "?" + sp;
  const headers = S.apiKey ? { "X-Api-Key": S.apiKey } : {};
  const r = await fetch(url, { headers });
  if (!r.ok) throw new Error("API trả lỗi " + r.status + (r.status === 429 ? " (tra quá nhanh, đợi chút hoặc thêm API key)" : ""));
  return (await r.json()).data || [];
}
const normNum = s => /^\d+$/.test(s) ? String(+s) : s.toUpperCase();
const nameQ = s => s.includes(" ") ? `name:"${s}"` : `name:${s}*`;

async function lookup(raw) {
  const s = raw.trim().replace(/\s+/g, " ");
  if (!s) return [];
  let m;
  // 1. API id: sv3pt5-25, base1-4, swsh12pt5-160
  if ((m = s.match(/^([a-z0-9]+(?:pt\d+)?)-([a-z0-9]+)$/i))) {
    const r = await api({ q: `id:"${s.toLowerCase()}"` });
    if (r.length) return r;
  }
  // 2. number/total: 58/102  or  pikachu 58/102
  if ((m = s.match(/^(?:(.+?) )?([a-z]*\d+)\s*\/\s*([a-z]*\d+)$/i))) {
    const q = [`number:${normNum(m[2])}`];
    if (/^\d+$/.test(m[3])) q.push(`set.printedTotal:${+m[3]}`);
    if (m[1]) q.push(nameQ(m[1]));
    const r = await api({ q: q.join(" ") });
    if (r.length) return r;
  }
  // 3. set code + number: MEW 25, PAF 54  — or name + number: pikachu 25
  if ((m = s.match(/^(.+) ([a-z]*\d+[a-z]*)$/i))) {
    const code = m[1], num = normNum(m[2]);
    if (/^[a-z0-9]{2,6}$/i.test(code)) {
      let r = await api({ q: `set.ptcgoCode:${code.toUpperCase()} number:${num}` });
      if (r.length) return r;
      r = await api({ q: `set.id:${code.toLowerCase()} number:${num}` });
      if (r.length) return r;
    }
    const r = await api({ q: `${nameQ(code)} number:${num}` });
    if (r.length) return r;
  }
  // 4. name
  if (/[\/]/.test(s) || /^[a-z0-9]+-[a-z0-9]+$/i.test(s)) return [];
  return api({ q: nameQ(s) });
}

/* ---------- Japanese cards (TCGdex) ---------- */
const TD = "https://api.tcgdex.net/v2/ja";
async function td(path) {
  const r = await fetch(TD + path);
  if (r.status === 404) return null;
  if (!r.ok) throw new Error("TCGdex trả lỗi " + r.status);
  return r.json();
}
let jaSets = null;
async function getJaSets() {
  if (jaSets) return jaSets;
  try { const c = JSON.parse(localStorage.getItem("td-ja-sets") || "null"); if (c && Date.now() - c.t < 864e5) return (jaSets = c.d); } catch (e) {}
  jaSets = (await td("/sets")) || [];
  try { localStorage.setItem("td-ja-sets", JSON.stringify({ t: Date.now(), d: jaSets })); } catch (e) {}
  return jaSets;
}
function localForms(n) {
  const s = String(n).toUpperCase();
  if (/^\d+$/.test(s)) return [...new Set([s.padStart(3, "0"), String(+s), s])];
  return [s];
}
async function jpSetCard(setId, num) {
  for (const l of localForms(num)) {
    const c = await td(`/sets/${encodeURIComponent(setId)}/${encodeURIComponent(l)}`);
    if (c && c.id) return c;
  }
  return null;
}
function toJaName(s) {
  if (/[぀-ヿ一-鿿]/.test(s)) return s;
  const low = s.toLowerCase();
  let i = NAMES_EN.findIndex(n => n.toLowerCase() === low);
  if (i < 0) i = NAMES_KO.indexOf(s);
  if (i < 0) i = NAMES_EN.findIndex(n => n.toLowerCase().startsWith(low));
  return i >= 0 ? NAMES_JA[i] : null;
}
async function jpLookup(raw) {
  const s = raw.trim().replace(/\s+/g, " ");
  let m;
  // 068/064  or  bruxish 068/064
  if ((m = s.match(/^(?:(.+?) )?([a-z]*\d+)\s*\/\s*(\d+)$/i))) {
    const total = +m[3];
    const sets = (await getJaSets()).filter(x => x.cardCount && +x.cardCount.official === total).reverse().slice(0, 10);
    let found = (await Promise.all(sets.map(x => jpSetCard(x.id, m[2]).catch(() => null)))).filter(Boolean);
    if (m[1]) { const ja = toJaName(m[1]); if (ja) found = found.filter(c => (c.name || "").includes(ja)); }
    return found;
  }
  // SV7a 068  or  sv7a-068
  if ((m = s.match(/^([a-z0-9]+)[ -]([a-z]*\d+)$/i))) {
    const set = (await getJaSets()).find(x => x.id.toLowerCase() === m[1].toLowerCase());
    if (set) { const c = await jpSetCard(set.id, m[2]); return c ? [c] : []; }
  }
  // name (English, Korean or Japanese)
  const ja = toJaName(s);
  if (!ja) return [];
  const list = (await td(`/cards?name=${encodeURIComponent(ja)}`)) || [];
  const pick = list.slice(-12).reverse();
  return (await Promise.all(pick.map(b => td(`/cards/${encodeURIComponent(b.id)}`).catch(() => null)))).filter(Boolean);
}

async function doSearch(q) {
  $("sInput").value = q;
  $("status").className = "status"; $("status").textContent = "Đang tra thẻ Nhật và thẻ Anh…"; $("results").innerHTML = "";
  const [jp, en] = await Promise.allSettled([jpLookup(q), lookup(q)]);
  const list = [
    ...(jp.status === "fulfilled" ? jp.value.map(normJP) : []),
    ...(en.status === "fulfilled" ? en.value.map(normEN) : [])
  ];
  const errs = [jp, en].filter(r => r.status === "rejected").map(r => r.reason);
  if (errs.length === 2 && errs.every(x => x && (x.name === "TypeError" || /load failed|failed to fetch|network/i.test(x.message || "")))) {
    $("status").className = "status err";
    $("status").textContent = "Không kết nối được máy chủ thẻ. Nếu bạn đang mở trong khung xem trước của app Claude thì khung này chặn internet, hãy mở bằng Chrome hoặc Safari.";
    return;
  }
  const notes = [];
  const why = r => `${r.reason?.name || "Error"}: ${r.reason?.message || r.reason}`;
  if (jp.status === "rejected") notes.push("nguồn thẻ Nhật lỗi (" + why(jp) + ")");
  if (en.status === "rejected") notes.push("nguồn thẻ Anh lỗi (" + why(en) + ")");
  if (errs.length) notes.push("đang mở từ: " + (location.protocol || "?") + " · " + (navigator.userAgent.match(/(CriOS|Chrome|Safari|Firefox)\/[\d.]+/)?.[0] || "?"));
  $("status").textContent = (list.length ? `${list.length} thẻ khớp` : "Không tìm thấy thẻ. Thử 068/064, SV7a 068, sv3pt5-25 hoặc tên Pokémon.") + (notes.length ? " · " + notes.join(", ") : "");
  renderResults(list);
}

  $("dlgBody").innerHTML = `<div class="dlg"><div>${art}</div><div>
    <div class="meta" style="font:600 13px var(--f-display);color:var(--ink-3)">#${pad(n)}</div>
    <h3>${esc(NAMES_EN[n-1])}</h3><div class="ko">${esc(NAMES_KO[n-1])} · ${esc(NAMES_JA[n-1])}</div>${info}
    <div class="act">
      <button class="btn primary" data-a="find">Tìm thẻ ${esc(NAMES_EN[n-1])}</button>
      ${!o ? `<button class="btn" data-a="mark">Đánh dấu đã có</button>` : ""}
      ${c ? `<button class="btn" data-a="refresh">Cập nhật giá</button>` : ""}
      ${o ? `<button class="btn danger" data-a="remove">${c ? "Gỡ thẻ" : "Bỏ đánh dấu"}</button>` : ""}
      <button class="btn" data-a="close">Đóng</button>
    </div></div></div>`;
  $("dlgBody").onclick = async e => {
    const a = e.target.dataset.a; if (!a) return;
    if (a === "close") $("dlg").close();
    if (a === "find") { $("dlg").close(); doSearch(NAMES_EN[n-1]); $("sInput").scrollIntoView({ behavior: "smooth", block: "center" }); }
    if (a === "mark") { S.owned[n] = { at: Date.now() }; done(); }
    if (a === "remove") { delete S.owned[n]; done(); }
    if (a === "refresh") {
      e.target.textContent = "Đang cập nhật…";
      try { const nc = await refetch(c); if (nc) { S.owned[n].card = nc; done(); openSlot(n); } else e.target.textContent = "Không tìm thấy"; }
      catch (err) { e.target.textContent = "Lỗi, thử lại"; }
    }
    function done() { save(); renderStats(); renderBinder(); if (!$("viewList").hidden) renderList(); $("dlg").close(); }
  };
  if (!$("dlg").open) $("dlg").showModal();
}

/* ---------- settings ---------- */
$("apiKey").value = S.apiKey || "";
$("apiKey").onchange = e => { S.apiKey = e.target.value.trim(); save(); };
$("krw").value = S.krw || "";
$("krw").onchange = e => { S.krw = Math.max(0, +e.target.value || 0); save(); renderStats(); };
$("refresh").onclick = async e => {
  const entries = Object.entries(S.owned).filter(([, o]) => o.card);
  if (!entries.length) return toast("Chưa có thẻ nào để cập nhật");
  const btn = e.target; btn.disabled = true;
  try {
    const en = entries.filter(([, o]) => (o.card.src || "en") === "en"), jp = entries.filter(([, o]) => o.card.src === "jp");
    for (let i = 0; i < en.length; i += 40) {
      btn.textContent = `Đang cập nhật thẻ Anh ${i}/${en.length}…`;
      const chunk = en.slice(i, i + 40);
      const r = await api({ q: "(" + chunk.map(([, o]) => `id:"${o.card.id}"`).join(" OR ") + ")", pageSize: "250", orderBy: "" });
      const byId = Object.fromEntries(r.map(c => [c.id, c]));
      for (const [n, o] of chunk) if (byId[o.card.id]) S.owned[n].card = normEN(byId[o.card.id]);
    }
    for (let i = 0; i < jp.length; i++) {
      btn.textContent = `Đang cập nhật thẻ Nhật ${i}/${jp.length}…`;
      const [n, o] = jp[i]; const nc = await refetch(o.card).catch(() => null); if (nc) S.owned[n].card = nc;
    }
    save(); renderStats(); renderBinder(); toast("Đã cập nhật giá");
  } catch (err) { toast("Cập nhật lỗi: " + err.message); }
  btn.disabled = false; btn.textContent = "Cập nhật giá cả collection";
};
$("exportB").onclick = () => {
  const blob = new Blob([JSON.stringify({ owned: S.owned, krw: S.krw }, null, 1)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "pokedex-binder-" + new Date().toISOString().slice(0, 10) + ".json"; a.click();
};
$("importF").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const d = JSON.parse(await f.text()); if (!d.owned) throw 0; S.owned = d.owned; if (d.krw) S.krw = d.krw; save(); renderStats(); renderBinder(); toast("Đã nhập collection"); }
  catch (err) { toast("File không đúng định dạng sao lưu"); }
};

/* ---------- misc ---------- */
let tt; function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2200); }
$("prev").onclick = () => goPage(S.page - 1);
$("next").onclick = () => goPage(S.page + 1);
$("pgSelect").onchange = e => goPage(+e.target.value);
document.addEventListener("keydown", e => {
  if (e.target.closest("input,select,textarea,dialog") || $("viewBinder").hidden) return;
  if (e.key === "ArrowLeft") goPage(S.page - 1);
  if (e.key === "ArrowRight") goPage(S.page + 1);
});

buildNav(); renderStats(); renderBinder();
</script>

</body>
</html>
